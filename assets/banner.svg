<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="PalForge — a content framework for Palworld">
  <title>PalForge — a content framework for Palworld</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0d1218"/>
      <stop offset="0.55" stop-color="#161d27"/>
      <stop offset="1"   stop-color="#0d1218"/>
    </linearGradient>
    <linearGradient id="heat2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#7a2a12"/>
      <stop offset="0.5" stop-color="#e2621d"/>
      <stop offset="1"   stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#e9eef5"/>
      <stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1"   stop-color="#5d6f85"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="250" cy="330" r="300" fill="url(#glow2)"/>

  <g transform="translate(110,180) scale(0.62)">
    <path d="M126 300 h260 l-26 34 h-49 l-6 26 h48 l22 40 H147 l22-40 h48 l-6-26 h-49 z"
          fill="url(#steel2)"/>
    <rect x="196" y="404" width="120" height="26" rx="8" fill="#43536a"/>
    <circle cx="256" cy="196" r="26" fill="url(#heat2)"/>
    <circle cx="196" cy="150" r="13" fill="#f5a524" opacity="0.9"/>
    <circle cx="318" cy="140" r="10" fill="#ffd978" opacity="0.85"/>
    <circle cx="256" cy="196" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  </g>

  <text x="470" y="286" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" fill="#f2f5f9" letter-spacing="-2">PalForge</text>
  <text x="474" y="344" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="34" fill="#f5a524">A content framework for Palworld</text>
  <text x="474" y="404" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="27" fill="#8fa1b6">Declare a pal, an item, a building or a UI panel —</text>
  <text x="474" y="442" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="27" fill="#8fa1b6">PalForge wires it to the game's own events.</text>
  <text x="474" y="510" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="23" fill="#5d6f85">UE4SS Lua · single-player · measured against Palworld v1.0.2.101103</text>
</svg>
