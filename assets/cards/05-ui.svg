<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="PalForge — A panel inside the game's own UI">
  <title>PalForge — A panel inside the game's own UI</title>
  <desc>Declared as a tree, mounted into Palworld's layout, and it takes itself down.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a2a12"/><stop offset="0.45" stop-color="#e2621d"/>
      <stop offset="0.8" stop-color="#f5a524"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef5"/><stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#5d6f85"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e2621d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0d1218"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#wire)"/>

  <g transform="translate(1120,24) scale(0.19)" opacity="0.9">
    <path d="M126 300 h260 l-26 34 h-49 l-6 26 h48 l22 40 H147 l22-40 h48 l-6-26 h-49 z" fill="url(#steel)"/>
    <rect x="196" y="404" width="120" height="26" rx="8" fill="#43536a"/>
    <circle cx="256" cy="196" r="26" fill="url(#heat)"/>
    <circle cx="196" cy="150" r="13" fill="#f5a524" opacity="0.9"/>
    <circle cx="318" cy="140" r="10" fill="#ffd978" opacity="0.85"/>
    <circle cx="256" cy="196" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  </g>

  <text x="72" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5a524" letter-spacing="3">EXTEND THE INTERFACE</text>
  <text x="72" y="176" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e9eef5">A panel inside the game's own UI</text>
  <text x="72" y="216" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c4">Declared as a tree, mounted into Palworld's layout, and it takes itself down.</text>

  <rect x="72" y="250" width="560" height="331" rx="12" fill="#141b25" stroke="#243040" stroke-width="2"/>
  <text x="94" y="284" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">UI{</text>
  <text x="94" y="311" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    id   = "pack:Panel",</text>
  <text x="94" y="338" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    host = "game",</text>
  <text x="94" y="365" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#f5a524" xml:space="preserve">    keys = { "INS" },</text>
  <text x="94" y="392" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    root = UI.Frame{</text>
  <text x="94" y="419" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">        UI.VBox{</text>
  <text x="94" y="446" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">            UI.Label{ text = "Ore burned: 12" },</text>
  <text x="94" y="473" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">            UI.Button{ text = "Reset" },</text>
  <text x="94" y="500" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">        },</text>
  <text x="94" y="527" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    },</text>
  <text x="94" y="554" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">}</text>

  <rect x="700" y="250" width="508" height="252" rx="14" fill="#141b25" stroke="#243040" stroke-width="3"/>
  <text x="722" y="284" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#5d6f85">Palworld’s own layout</text>
  <rect x="736" y="302" width="300" height="92" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="886" y="344" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">your panel</text>
  <text x="886" y="372" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">mounted, not drawn over</text>
  <rect x="1060" y="302" width="128" height="92" rx="10" fill="none" stroke="#243040" stroke-width="3"/>
  <text x="1124" y="354" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#5d6f85">the HUD</text>
  <rect x="736" y="414" width="452" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="962" y="455" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">keys · mouse buttons · back handler</text>
  <text x="700" y="556" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#9fb0c4">A press is ROUTED, never consumed — the game still gets it.</text>

  <text x="72" y="674" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#5d6f85">PalForge never calls SetInputMode itself. The game's own action router owns the input mode; doing otherwise broke Esc twice.</text>
  <text x="1208" y="674" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#5d6f85">PalForge · UE4SS Lua · single-player</text>
</svg>
