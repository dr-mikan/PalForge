<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PalForge">
  <title>PalForge</title>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#7a2a12"/>
      <stop offset="0.45" stop-color="#e2621d"/>
      <stop offset="0.8" stop-color="#f5a524"/>
      <stop offset="1"   stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#e9eef5"/>
      <stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1"   stop-color="#5d6f85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#12171f"/>
  <circle cx="256" cy="330" r="150" fill="url(#glow)"/>

  <!-- anvil: the forge half -->
  <path d="M126 300 h260 l-26 34 h-49 l-6 26 h48 l22 40 H147 l22-40 h48 l-6-26 h-49 z"
        fill="url(#steel)"/>
  <rect x="196" y="404" width="120" height="26" rx="8" fill="#43536a"/>

  <!-- the spark: three rising motes, the "it fired" of an event -->
  <circle cx="256" cy="196" r="26" fill="url(#heat)"/>
  <circle cx="196" cy="150" r="13" fill="#f5a524" opacity="0.9"/>
  <circle cx="318" cy="140" r="10" fill="#ffd978" opacity="0.85"/>

  <!-- a socket ring: the pack plugging in -->
  <circle cx="256" cy="196" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  <circle cx="256" cy="196" r="76" fill="none" stroke="#f5a524" stroke-width="4" opacity="0.25"/>
</svg>
