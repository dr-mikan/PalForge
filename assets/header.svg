<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 372" width="1300" height="372" role="img" aria-label="PalForge — add new pals, items and buildings to Palworld">
  <title>PalForge</title>
  <desc>A content framework for single-player Palworld, running on UE4SS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="0.5" stop-color="#161d27"/>
      <stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a2a12"/><stop offset="0.45" stop-color="#e2621d"/>
      <stop offset="0.8" stop-color="#f5a524"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef5"/><stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#5d6f85"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e2621d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1300" height="372" fill="url(#bg)"/>
  <circle cx="196" cy="196" r="228" fill="url(#glow)"/>
  <rect x="0" y="367" width="1300" height="5" fill="url(#wire)"/>

  <g transform="translate(52,26) scale(0.62)" opacity="1.0">
    <path d="M96 302 L152 282 L396 282 L396 320 L336 334 L312 358 L312 384 L360 384 L360 418 L152 418 L152 384 L200 384 L200 358 L176 334 L116 320 Z" fill="url(#steel)"/>
    <rect x="150" y="418" width="212" height="18" rx="6" fill="#43536a"/>
    <circle cx="256" cy="186" r="26" fill="url(#heat)"/>
    <circle cx="196" cy="140" r="13" fill="#f5a524" opacity="0.9"/>
    <circle cx="318" cy="130" r="10" fill="#ffd978" opacity="0.85"/>
    <circle cx="256" cy="186" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  </g>

  <text x="410" y="168" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="86" font-weight="700"
        fill="#f2f5f9" letter-spacing="-2">PalForge</text>
  <text x="414" y="222" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#f5a524">Add new pals, items and buildings to Palworld</text>
  <text x="414" y="270" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#9fb0c4">Declare it in a few lines of Lua — the game’s own events are already wired</text>
  <text x="414" y="316" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#5d6f85">UE4SS · single-player · MIT · measured against Palworld v1.0.2.101103</text>
</svg>
