<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PalForge concept F — the hearth">
  <title>Concept F — the hearth: the game's world, warmed from inside</title>
  <defs>
    <linearGradient id="f-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a2a12"/><stop offset="0.4" stop-color="#e2621d"/>
      <stop offset="0.85" stop-color="#ffd978"/><stop offset="1" stop-color="#fff2cf"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#12171f"/>
  <circle cx="256" cy="300" r="170" fill="url(#f-glow)"/>

  <!-- a hex: the game's own world, tiled and finite -->
  <path d="M256 96 L404 182 V354 L256 440 L108 354 V182 Z"
        fill="#1a2230" stroke="#3a4657" stroke-width="10" stroke-linejoin="round"/>
  <!-- the tiling, faint -->
  <g stroke="#243040" stroke-width="3" fill="none">
    <path d="M256 96 V440"/><path d="M108 182 L404 354"/><path d="M404 182 L108 354"/>
  </g>
  <!-- the flame inside it -->
  <path d="M256 372 c-46 0 -78 -30 -78 -70 0 -46 40 -66 52 -112 4 -16 2 -28 -4 -40
           34 12 58 44 58 78 0 20 -10 32 -10 46 0 12 8 20 18 20 14 0 22 -14 22 -34
           0 -14 -4 -26 -10 -36 34 20 50 50 50 78 0 40 -34 70 -98 70 z"
        fill="url(#f-heat)"/>
  <circle cx="256" cy="146" r="8" fill="#ffd978" opacity="0.8"/>
  <circle cx="212" cy="168" r="5" fill="#f5a524" opacity="0.6"/>
  <circle cx="302" cy="164" r="5" fill="#f5a524" opacity="0.6"/>
</svg>
