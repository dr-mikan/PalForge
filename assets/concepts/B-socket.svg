<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PalForge concept B — the socket">
  <title>Concept B — the socket: a declaration plugging into the game's own events</title>
  <defs>
    <linearGradient id="b-heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e2621d"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <radialGradient id="b-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0"/><stop offset="0.55" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#c2490f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#12171f"/>
  <!-- the game: a closed ring, complete without you -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#3a4657" stroke-width="26"/>
  <!-- four sockets cut into it -->
  <g fill="#12171f">
    <rect x="243" y="93"  width="26" height="46" rx="4"/>
    <rect x="243" y="373" width="26" height="46" rx="4"/>
    <rect x="93"  y="243" width="46" height="26" rx="4"/>
    <rect x="373" y="243" width="46" height="26" rx="4"/>
  </g>
  <!-- three filled by a pack, one left open: the framework does not require all of them -->
  <g fill="url(#b-heat)">
    <rect x="243" y="93"  width="26" height="46" rx="4"/>
    <rect x="93"  y="243" width="46" height="26" rx="4"/>
    <rect x="373" y="243" width="46" height="26" rx="4"/>
  </g>
  <rect x="243" y="373" width="26" height="46" rx="4" fill="none" stroke="#5d6f85" stroke-width="3" stroke-dasharray="5 5"/>
  <!-- what the sockets carry -->
  <circle cx="256" cy="256" r="62" fill="url(#b-core)"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#ffd978" stroke-width="3" opacity="0.6"/>
  <g stroke="url(#b-heat)" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <path d="M256 139 v55"/><path d="M139 256 h55"/><path d="M373 256 h-55"/>
  </g>
</svg>
