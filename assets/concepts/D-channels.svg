<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PalForge concept D — the channels">
  <title>Concept D — the channels: one event, many listeners</title>
  <defs>
    <linearGradient id="d-heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e2621d"/>
    </linearGradient>
    <radialGradient id="d-src" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0"/><stop offset="1" stop-color="#e2621d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#12171f"/>

  <!-- the game emits, once, on the left -->
  <circle cx="112" cy="256" r="34" fill="url(#d-src)"/>
  <circle cx="112" cy="256" r="52" fill="none" stroke="#f5a524" stroke-width="3" opacity="0.35"/>
  <circle cx="112" cy="256" r="72" fill="none" stroke="#f5a524" stroke-width="2" opacity="0.16"/>

  <!-- fanning out to four subscribers -->
  <g fill="none" stroke="url(#d-heat)" stroke-width="6" stroke-linecap="round">
    <path d="M156 232 C 240 150, 280 130, 356 122"/>
    <path d="M158 246 C 250 220, 290 208, 356 202"/>
    <path d="M158 266 C 250 292, 290 304, 356 310"/>
    <path d="M156 280 C 240 362, 280 382, 356 390"/>
  </g>

  <!-- the listeners: three live, one declared and never fired -->
  <g>
    <rect x="356" y="98"  width="76" height="48" rx="10" fill="#2b3648" stroke="#f5a524" stroke-width="3"/>
    <rect x="356" y="178" width="76" height="48" rx="10" fill="#2b3648" stroke="#f5a524" stroke-width="3"/>
    <rect x="356" y="286" width="76" height="48" rx="10" fill="#2b3648" stroke="#f5a524" stroke-width="3"/>
    <rect x="356" y="366" width="76" height="48" rx="10" fill="#1a2230" stroke="#5d6f85" stroke-width="3" stroke-dasharray="6 5"/>
  </g>
  <g fill="#f5a524">
    <circle cx="394" cy="122" r="7"/><circle cx="394" cy="202" r="7"/><circle cx="394" cy="310" r="7"/>
  </g>
  <circle cx="394" cy="390" r="7" fill="none" stroke="#5d6f85" stroke-width="2.5"/>
</svg>
