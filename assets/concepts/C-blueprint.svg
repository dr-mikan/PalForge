<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PalForge concept C — the blueprint">
  <title>Concept C — the blueprint: a declaration becoming a real thing</title>
  <defs>
    <linearGradient id="c-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c2490f"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="c-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6f85" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5d6f85" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#12171f"/>
  <!-- blueprint grid, left half only: the declared side -->
  <g stroke="#243040" stroke-width="1.5">
    <path d="M64 96 V416 M120 96 V416 M176 96 V416 M232 96 V416"/>
    <path d="M64 96 H256 M64 152 H256 M64 208 H256 M64 264 H256 M64 320 H256 M64 376 H256 M64 416 H256"/>
  </g>
  <!-- the declaration: a wireframe outline -->
  <path d="M104 320 h112 v-72 l-56 -44 -56 44 z" fill="none" stroke="url(#c-fade)" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- the same shape, built, on the right -->
  <path d="M296 320 h112 v-72 l-56 -44 -56 44 z" fill="#2b3648"/>
  <path d="M296 248 l56 -44 56 44 -56 30 z" fill="#3d4c63"/>
  <rect x="336" y="272" width="32" height="48" rx="4" fill="url(#c-heat)"/>
  <!-- the transition -->
  <path d="M236 268 h44" stroke="#f5a524" stroke-width="7" stroke-linecap="round"/>
  <path d="M268 254 l18 14 -18 14 z" fill="#f5a524"/>
  <circle cx="352" cy="176" r="9"  fill="#f5a524" opacity="0.9"/>
  <circle cx="326" cy="150" r="6"  fill="#ffd978" opacity="0.75"/>
  <circle cx="378" cy="146" r="5"  fill="#ffd978" opacity="0.6"/>
</svg>
