<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="PalForge — React to what the game does">
  <title>PalForge — React to what the game does</title>
  <desc>Twenty-one channels, fed by twenty-two native hooks. You declare a handler; it fires.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a2a12"/><stop offset="0.45" stop-color="#e2621d"/>
      <stop offset="0.8" stop-color="#f5a524"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef5"/><stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#5d6f85"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e2621d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0d1218"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#wire)"/>

  <g transform="translate(1116,10) scale(0.17)" opacity="0.9">
    <path d="M96 302 L152 282 L396 282 L396 320 L336 334 L312 358 L312 384 L360 384 L360 418 L152 418 L152 384 L200 384 L200 358 L176 334 L116 320 Z" fill="url(#steel)"/>
    <rect x="150" y="418" width="212" height="18" rx="6" fill="#43536a"/>
    <circle cx="256" cy="186" r="26" fill="url(#heat)"/>
    <circle cx="196" cy="140" r="13" fill="#f5a524" opacity="0.9"/>
    <circle cx="318" cy="130" r="10" fill="#ffd978" opacity="0.85"/>
    <circle cx="256" cy="186" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  </g>
  <text x="1208" y="118" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#5d6f85">PalForge · single-player</text>

  <text x="72" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5a524" letter-spacing="3">AND THE EVENTS ARE ALREADY WIRED</text>
  <text x="72" y="176" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e9eef5">React to what the game does</text>
  <text x="72" y="216" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c4">Twenty-one channels, fed by twenty-two native hooks. You declare a handler; it fires.</text>

  <rect x="72" y="250" width="560" height="277" rx="12" fill="#141b25" stroke="#243040" stroke-width="2"/>
  <text x="94" y="284" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Building{</text>
  <text x="94" y="311" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve">    id = "CampFire",     -- the vanilla campfire</text>
  <text x="94" y="338" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    events = {</text>
  <text x="94" y="365" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#f5a524" xml:space="preserve">        onRightClick = function(self, ctx)</text>
  <text x="94" y="392" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">            self.state.uses = self.state.uses + 1</text>
  <text x="94" y="419" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">            self:save()      -- survives a reload</text>
  <text x="94" y="446" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">        end,</text>
  <text x="94" y="473" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    },</text>
  <text x="94" y="500" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">}</text>

  <rect x="700" y="250" width="214" height="82" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="807" y="287" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">the game</text>
  <text x="807" y="315" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">does a thing</text>
  <path d="M914 291 L978 291" stroke="#f5a524" stroke-width="4" stroke-linecap="round"/>
  <path d="M965 282 L978 291 L965 300 Z" fill="#f5a524"/>
  <rect x="978" y="250" width="230" height="82" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="1093" y="287" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">your handler</text>
  <text x="1093" y="315" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">runs</text>
  <rect x="700" y="356" width="508" height="74" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="954" y="400" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">onPlace · onRightClick · onTick · onRemove</text>
  <rect x="700" y="444" width="508" height="74" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="954" y="488" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">onUse · onCraft · onObtain · onDiscard</text>
  <rect x="700" y="532" width="508" height="66" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="954" y="572" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">onSpawned · onDamaged · onDeath · onCaptured</text>
  <circle cx="914" cy="291" r="21" fill="url(#glow)"/>
  <circle cx="914" cy="291" r="7" fill="#ffd978"/>

  <text x="72" y="646" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#5d6f85">No polling loop to write, no hook to register. A channel with no native source behind it says so instead of staying</text>
  <text x="72" y="672" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#5d6f85">quiet.</text>
</svg>
