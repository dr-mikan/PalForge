<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="PalForge — Eight kinds of thing, one shape">
  <title>PalForge — Eight kinds of thing, one shape</title>
  <desc>A pal, an item, a building, a skill, an effect, a sound, a model, a panel.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a2a12"/><stop offset="0.45" stop-color="#e2621d"/>
      <stop offset="0.8" stop-color="#f5a524"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef5"/><stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#5d6f85"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e2621d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0d1218"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#wire)"/>

  <g transform="translate(1120,24) scale(0.19)" opacity="0.9">
    <path d="M126 300 h260 l-26 34 h-49 l-6 26 h48 l22 40 H147 l22-40 h48 l-6-26 h-49 z" fill="url(#steel)"/>
    <rect x="196" y="404" width="120" height="26" rx="8" fill="#43536a"/>
    <circle cx="256" cy="196" r="26" fill="url(#heat)"/>
    <circle cx="196" cy="150" r="13" fill="#f5a524" opacity="0.9"/>
    <circle cx="318" cy="140" r="10" fill="#ffd978" opacity="0.85"/>
    <circle cx="256" cy="196" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  </g>

  <text x="72" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5a524" letter-spacing="3">WHAT YOU CAN DECLARE</text>
  <text x="72" y="176" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e9eef5">Eight kinds of thing, one shape</text>
  <text x="72" y="216" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c4">A pal, an item, a building, a skill, an effect, a sound, a model, a panel.</text>

  <rect x="72" y="250" width="560" height="304" rx="12" fill="#141b25" stroke="#243040" stroke-width="2"/>
  <text x="94" y="284" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Pal{      id = "mypack:Boss",  ... }</text>
  <text x="94" y="311" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Item{     id = "mypack:Potion", ... }</text>
  <text x="94" y="338" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Building{ id = "mypack:Bench", ... }</text>
  <text x="94" y="365" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Skill{    id = "mypack:Ember", ... }</text>
  <text x="94" y="392" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Effect{   id = "mypack:Regen", ... }</text>
  <text x="94" y="419" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Audio{    id = "AKE_BGM_Title" }</text>
  <text x="94" y="446" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">Mesh{     id = "mypack:Body",  ... }</text>
  <text x="94" y="473" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">UI{       id = "mypack:Panel", ... }</text>
  <text x="94" y="500" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve"></text>
  <text x="94" y="527" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve">Item.get("Wood"):give(10)   -- and act on it</text>

  <rect x="700" y="250" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="823" y="280" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Pal</text>
  <text x="823" y="308" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">creatures</text>
  <rect x="962" y="250" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="1085" y="280" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Item</text>
  <text x="1085" y="308" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">things</text>
  <rect x="700" y="332" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="823" y="362" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Building</text>
  <text x="823" y="390" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">structures</text>
  <rect x="962" y="332" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="1085" y="362" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Skill</text>
  <text x="1085" y="390" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">moves &amp; passives</text>
  <rect x="700" y="414" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="823" y="444" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Effect</text>
  <text x="823" y="472" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">status ailments</text>
  <rect x="962" y="414" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="1085" y="444" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Audio</text>
  <text x="1085" y="472" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">1957 sounds</text>
  <rect x="700" y="496" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="823" y="526" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Mesh</text>
  <text x="823" y="554" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">models &amp; materials</text>
  <rect x="962" y="496" width="246" height="68" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="1085" y="526" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">UI</text>
  <text x="1085" y="554" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">panels</text>
  <text x="700" y="596" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#9fb0c4">Every one is the same shape: call it to define, get a handle back.</text>

  <text x="72" y="674" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#5d6f85">Every field is checked where you typed it — an undeclared field is an error with a did-you-mean, never a silent no-op.</text>
  <text x="1208" y="674" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#5d6f85">PalForge · UE4SS Lua · single-player</text>
</svg>
