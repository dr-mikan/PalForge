<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="PalForge — Beside the mod, not inside the save">
  <title>PalForge — Beside the mod, not inside the save</title>
  <desc>One folder per save, one file per mod. Plain JSON you can open.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a2a12"/><stop offset="0.45" stop-color="#e2621d"/>
      <stop offset="0.8" stop-color="#f5a524"/><stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef5"/><stop offset="0.5" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#5d6f85"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e2621d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0d1218"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#wire)"/>

  <g transform="translate(1116,10) scale(0.17)" opacity="0.9">
    <path d="M96 302 L152 282 L396 282 L396 320 L336 334 L312 358 L312 384 L360 384 L360 418 L152 418 L152 384 L200 384 L200 358 L176 334 L116 320 Z" fill="url(#steel)"/>
    <rect x="150" y="418" width="212" height="18" rx="6" fill="#43536a"/>
    <circle cx="256" cy="186" r="26" fill="url(#heat)"/>
    <circle cx="196" cy="140" r="13" fill="#f5a524" opacity="0.9"/>
    <circle cx="318" cy="130" r="10" fill="#ffd978" opacity="0.85"/>
    <circle cx="256" cy="186" r="52" fill="none" stroke="#f5a524" stroke-width="7" opacity="0.55"/>
  </g>
  <text x="1208" y="118" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#5d6f85">PalForge · single-player</text>

  <text x="72" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5a524" letter-spacing="3">WHERE YOUR STATE LIVES</text>
  <text x="72" y="176" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e9eef5">Beside the mod, not inside the save</text>
  <text x="72" y="216" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c4">One folder per save, one file per mod. Plain JSON you can open.</text>

  <rect x="72" y="250" width="560" height="331" rx="12" fill="#141b25" stroke="#243040" stroke-width="2"/>
  <text x="94" y="284" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#f5a524" xml:space="preserve">local db = PalForge.pack("mypack").store</text>
  <text x="94" y="311" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve"></text>
  <text x="94" y="338" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">db.set("oreBurned", 12)</text>
  <text x="94" y="365" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve">db.get("oreBurned")        --&gt; 12</text>
  <text x="94" y="392" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">db.save()</text>
  <text x="94" y="419" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve"></text>
  <text x="94" y="446" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#5d6f85" xml:space="preserve">-- and per placed structure:</text>
  <text x="94" y="473" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">function Bench:onRightClick(ctx)</text>
  <text x="94" y="500" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    self.state.uses = self.state.uses + 1</text>
  <text x="94" y="527" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">    self:save()</text>
  <text x="94" y="554" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#e9eef5" xml:space="preserve">end</text>

  <text x="700" y="272" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#5d6f85">ue4ss/Mods/PalForge/state/</text>
  <rect x="700" y="286" width="508" height="66" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="954" y="315" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">one folder per save</text>
  <text x="954" y="343" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">w_1DF0E44B…</text>
  <rect x="724" y="368" width="226" height="66" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="837" y="397" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">yourmod.json</text>
  <text x="837" y="425" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">yours alone</text>
  <rect x="982" y="368" width="226" height="66" rx="12" fill="#141b25" stroke="#f5a524" stroke-width="3"/>
  <text x="1095" y="397" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">othermod.json</text>
  <text x="1095" y="425" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">never touched</text>
  <rect x="700" y="466" width="508" height="86" rx="12" fill="#141b25" stroke="#5d6f85" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="954" y="500" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9eef5">Palworld’s own save</text>
  <text x="954" y="528" text-anchor="middle" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#5d6f85">PalForge never writes here</text>
  <text x="700" y="596" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#9fb0c4">Delete the mod folder and it is all gone.</text>

  <text x="72" y="646" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#5d6f85">A crash mid-write leaves the previous version readable, and a file that will not parse is quarantined verbatim rather</text>
  <text x="72" y="672" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#5d6f85">than overwritten.</text>
</svg>
