name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Before the install, not after: the linter imports nothing but node builtins, so a
      # page with a dead link, an untranslated locale or a count the Lua tree contradicts
      # fails here in a second or two instead of after a full Next build. `npm run build`
      # runs it again through docs `prebuild`; this step is the one that reports it as its
      # own red step.
      - name: Lint content
        run: node docs/scripts/lint-content.mjs

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build static site
        working-directory: docs
        env:
          # Project pages live under https://<user>.github.io/<repo>.
          NEXT_PUBLIC_BASE_PATH: /PalForge
        run: npm run build

      - name: Disable Jekyll
        run: touch docs/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
